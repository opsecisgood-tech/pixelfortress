# Deploys the game to GitHub Pages. The repository root is the playable site (no build step).
# One-time setup: Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
# Two jobs (build uploads the site, deploy publishes it) so the deploy step always finds exactly
# one fresh artifact. To redeploy, push a commit or use "Run workflow" rather than re-running a
# failed job (a re-run uploads a second artifact into the same run).
name: Deploy to GitHub Pages
on:
  push:
    # main, plus the current development branch (this repository's default branch)
    branches: [main, claude/great-bell-5k7f5m]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Assemble site
        run: |
          mkdir _site
          cp -r index.html css src vendor fonts .nojekyll _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
