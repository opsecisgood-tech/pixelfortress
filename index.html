<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Pixel Fortress</title>
  <meta name="description" content="Pixel Fortress — a class-based, blocky multiplayer FPS. Eight classes, two teams, six maps. Plays in your browser.">
  <meta name="theme-color" content="#2e2925">
  <link rel="icon" type="image/png" sizes="64x64" href="assets/favicon-64.png">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16.png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@800&family=Barlow+Semi+Condensed:wght@600;700;800&family=Oswald:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script type="importmap">
    { "imports": { "three": "./vendor/three.module.min.js" } }
  </script>
  <script src="vendor/peerjs.min.js" defer></script>
</head>
<body>
  <canvas id="view" aria-label="Game view"></canvas>
  <div id="ui"></div>
  <div id="touch"></div>
  <noscript><p style="color:#fff;padding:2rem">Pixel Fortress needs JavaScript and WebGL.</p></noscript>
  <div id="boot" class="boot">
    <div class="boot-logo">PIXEL<br>FORTRESS</div>
    <div class="boot-bar"><i></i></div>
    <p class="boot-msg">Painting pixels…</p>
  </div>
  <script type="module" src="src/client/main.js"></script>
</body>
</html>
